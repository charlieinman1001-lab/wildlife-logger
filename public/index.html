<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#245a40">
    <link rel="apple-touch-icon" href="/images/favicon.png">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Wildlife Logger</title>
</head>
<body>
    <div id="backdrop"></div>
    <header class="pageHeader">
        <h1>Wildlife Logger</h1>
    </header>

    <main id="layout">


        <div id="sightingsBrowser">
            <span id="sightingsListHeader">Sightings Browser</span>
            <div id="map"></div>

            <input type="text" id="sightingsBrowserInput" class="textInput" placeholder="e.g. Frog">
            <div id="sightingsListContainer">
                <ul id="sightingsList" style="padding: 0px;"></ul>
            </div>

        </div>


        <form id="speciesForm">
            <label for="speciesInput">Log new species:</label>
            <input type="text" id="speciesInput" class="textInput" name="speciesInput" maxlength="30" autocomplete="off" required><br>


            <fieldset class="toggle">
            <legend class="visually-hidden">Type</legend>

            <input type="radio" name="kind" id="kind-flora" value="flora" checked>
            <label for="kind-flora">Flora</label>

            <input type="radio" name="kind" id="kind-fauna" value="fauna">
            <label for="kind-fauna">Fauna</label>

            <span class="thumb"></span>
            </fieldset>


            <input type="file" id="imageInput" accept="image/*" name="imageInput" required>
            <img id="imagePreview" alt="Photo Preview" hidden>

            <input type="submit" value="Submit" id="submitSightingButton">
            <div id="loader"></div>
        </form>
    </main>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>
